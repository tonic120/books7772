<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Play a game on Books777 Arcade.">
  <title>Play | Books777 Arcade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffe14d'/%3E%3Ctext x='16' y='21' font-family='Arial Black,Arial' font-size='12' font-weight='900' text-anchor='middle' fill='%230a0618'%3EB7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/arcade.css">
</head>
<body class="player">
  <iframe class="game-frame" id="gameFrame" title="Game player"></iframe>

  <div class="edge-zone" aria-hidden="true"></div>
  <aside class="sidebar" aria-label="Game menu">
    <div class="handle">Menu</div>
    <div class="kicker">Now playing</div>
    <h1 id="gameTitle">Game</h1>
    <p>Move your mouse to the left edge at any time to open this menu.</p>
    <nav class="menu" aria-label="Player actions">
      <a class="button primary" href="games.html">Back to games</a>
      <a class="button" href="index.html">Home</a>
      <button class="theme-toggle" type="button" data-theme-toggle>Light mode</button>
    </nav>
    <div class="hint">Add more games by linking cards in <strong>games.html</strong> to this player page.</div>
  </aside>

  <section class="error" id="errorView" aria-live="polite">
    <div class="error-card">
      <h1>Game could not load</h1>
      <p>Use a path like <strong>my-game.html</strong> or <strong>html5game/index.html</strong> inside the games folder.</p>
      <p id="pathHelp"></p>
      <p><a href="games.html">Back to games</a></p>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedGame = params.get("game") || "sample-clicker.html";
    const requestedTitle = params.get("title") || "Sample Clicker";
    const normalizedGame = normalizeGamePath(requestedGame);
    const validGameName = /^(?!.*\.\.)(?!\/)[a-z0-9][a-z0-9._/-]*\.html$/i.test(normalizedGame);
    const frame = document.querySelector("#gameFrame");
    const errorView = document.querySelector("#errorView");
    const pathHelp = document.querySelector("#pathHelp");
    const themeButton = document.querySelector("[data-theme-toggle]");

    function normalizeGamePath(value) {
      let game = String(value || "")
        .trim()
        .replaceAll("\\", "/")
        .replace(/^\/+/, "")
        .replace(/^games\//i, "")
        .replace(/\/+$/, "");

      if (!game) {
        return "sample-clicker.html";
      }

      if (!game.toLowerCase().endsWith(".html")) {
        game = `${game}/index.html`;
      }

      return game;
    }

    if (validGameName) {
      frame.src = `games/${normalizedGame}`;
      document.querySelector("#gameTitle").textContent = requestedTitle;
      document.title = `${requestedTitle} | Books777 Arcade`;
    } else {
      frame.style.display = "none";
      errorView.style.display = "grid";
      pathHelp.textContent = `The path "${requestedGame}" could not be used. Try something like retrobowl/index.html.`;
    }

    const savedTheme = localStorage.getItem("books777-theme");

    if (savedTheme === "light") {
      document.body.classList.add("light");
    }

    function updateThemeButton() {
      const isLight = document.body.classList.contains("light");
      themeButton.textContent = isLight ? "Dark mode" : "Light mode";
    }

    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("light");
      localStorage.setItem("books777-theme", document.body.classList.contains("light") ? "light" : "dark");
      updateThemeButton();
    });

    updateThemeButton();
  </script>
</body>
</html>
