<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse games on Books777 Arcade.">
  <title>Games | Books777 Arcade</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffe14d'/%3E%3Ctext x='16' y='21' font-family='Arial Black,Arial' font-size='12' font-weight='900' text-anchor='middle' fill='%230a0618'%3EB7%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/arcade.css">
</head>
<body class="hub">
  <header class="site-header">
    <nav class="container nav" aria-label="Main navigation">
      <a class="brand" href="index.html">
        <span class="brand-mark">B7</span>
        <span>Books777 Arcade</span>
      </a>
      <div class="nav-actions">
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a class="active" href="games.html">Games</a></li>
        </ul>
        <button class="theme-toggle" type="button" data-theme-toggle>Light mode</button>
      </div>
    </nav>
  </header>

  <main class="catalog">
    <div class="container">
      <div class="page-heading">
        <div>
          <div class="eyebrow">Game library</div>
          <h1>Games</h1>
          <p>Pick a game and launch it through the arcade player.</p>
        </div>
        <a class="button primary" href="index.html">Home</a>
      </div>

      <div class="library-strip">
        <p>Local folders, hosted games, and thumbnail cards can all live in this menu.</p>
        <a class="button" id="featuredButton" href="games.html">Play featured</a>
      </div>

      <section aria-label="Available games">
        <div class="load-message" id="loadMessage">Loading game database...</div>
        <div class="games-grid" id="gamesGrid"></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">&copy; <span id="year"></span> Books777 Arcade</div>
  </footer>

  <script>
    const themeButton = document.querySelector("[data-theme-toggle]");
    const gamesGrid = document.querySelector("#gamesGrid");
    const loadMessage = document.querySelector("#loadMessage");
    const featuredButton = document.querySelector("#featuredButton");
    const savedTheme = localStorage.getItem("books777-theme");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function buildHref(game) {
      if (game.type === "external") {
        return `external-play.html?url=${encodeURIComponent(game.target)}&title=${encodeURIComponent(game.title)}`;
      }
      return `play.html?game=${encodeURIComponent(game.target)}&title=${encodeURIComponent(game.title)}`;
    }

    function renderGames(games) {
      gamesGrid.innerHTML = games.map((game) => {
        const tags = (game.tags || []).map((tag) => `<span class="pill">${escapeHtml(tag)}</span>`).join("");
        const featuredPill = game.featured ? `<span class="pill pill-featured">Featured</span>` : "";
        const cardClass = game.featured ? "game-card is-featured" : "game-card";
        const image = game.image || "images/game-placeholder.svg";
        return `<a class="${cardClass}" href="${escapeHtml(buildHref(game))}">
          <img class="game-thumb" src="${escapeHtml(image)}" alt="${escapeHtml(game.title)} thumbnail">
          <div class="game-body">
            <div class="game-meta">${featuredPill}${tags}</div>
            <h2>${escapeHtml(game.title)}</h2>
            <p>${escapeHtml(game.description || "A playable game added to Books777 Arcade.")}</p>
            <span class="game-action">Launch game</span>
          </div>
        </a>`;
      }).join("");
    }

    async function loadGames() {
      try {
        const response = await fetch("games-data.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Could not load games-data.json");
        }
        const games = await response.json();
        const gameList = Array.isArray(games) ? games : [];
        renderGames(gameList);
        const featuredGame = gameList.find((game) => game.featured) || gameList[0];
        if (featuredGame) {
          featuredButton.href = buildHref(featuredGame);
        }
        loadMessage.hidden = true;
      } catch (error) {
        loadMessage.textContent = "The game database could not load. Check games-data.json for missing commas or invalid JSON.";
      }
    }

    if (savedTheme === "light") {
      document.body.classList.add("light");
    }

    function updateThemeButton() {
      const isLight = document.body.classList.contains("light");
      themeButton.textContent = isLight ? "Dark mode" : "Light mode";
    }

    themeButton.addEventListener("click", () => {
      document.body.classList.toggle("light");
      localStorage.setItem("books777-theme", document.body.classList.contains("light") ? "light" : "dark");
      updateThemeButton();
    });

    updateThemeButton();
    loadGames();
    document.querySelector("#year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
